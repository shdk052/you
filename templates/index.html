<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מוריד שירים מיוטיוב</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>🎵 הורדת אודיו מיוטיוב</h1>
        <form id="downloadForm">
            <label for="youtubeLink">הכנס קישור לסרטון יוטיוב:</label>
            <input type="url" id="youtubeLink" name="youtubeLink" placeholder="https://youtube.com/..." required>
            <button type="submit">🚀 הורד עכשיו</button>
        </form>
        <div id="statusMessage"></div>
    </div>

    <script>
        const form = document.getElementById('downloadForm');
        const input = document.getElementById('youtubeLink');
        const statusMsg = document.getElementById('statusMessage');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const link = input.value;
            
            statusMsg.className = 'downloading';
            statusMsg.textContent = '⏳ מוריד... אנא המתן (עד 2 דקות)';

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ link: link })
                });

                if (response.ok) {
                    statusMsg.className = 'success';
                    statusMsg.textContent = '✅ ההורדה החלה!';
                    
                    const blob = await response.blob();
                    const contentDisposition = response.headers.get('content-disposition');
                    let fileName = 'download.mp3';

                    if (contentDisposition) {
                        const match = contentDisposition.match(/filename="(.+)"/);
                        if (match && match[1]) {
                            fileName = match[1].replace(/_/g, ' '); 
                        }
                    }

                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName; 
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    
                    statusMsg.className = 'success';
                    statusMsg.textContent = '🎉 השיר ירד בהצלחה!';

                } else {
                    const errorData = await response.json();
                    statusMsg.className = 'error';
                    statusMsg.textContent = '❌ ' + errorData.message;
                }

            } catch (error) {
                statusMsg.className = 'error';
                statusMsg.textContent = '❌ שגיאה: לא הצלחתי להתחבר לשרת';
                console.error('Error:', error);
            }
        });

        // יצירת כוכבים קבועים עם הבהוב עדין
        function createStars() {
            const starCount = 50;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                
                star.style.left = x + 'px';
                star.style.top = y + 'px';
                star.style.width = Math.random() * 2 + 1 + 'px';
                star.style.height = star.style.width;
                
                const delay = Math.random() * 4;
                const duration = Math.random() * 2 + 2;
                star.style.animationDelay = delay + 's';
                star.style.animationDuration = duration + 's';
                
                document.body.appendChild(star);
            }
        }

        // יצירת כוכבי שביט נופלים בולטים
        function createMeteor() {
            const meteor = document.createElement('div');
            meteor.className = 'meteor';
            
            // התחלה אקראית לגמרי
            const startX = Math.random() * window.innerWidth;
            const startY = -50;
            const endX = startX + (Math.random() * 200 - 100); // כיוון אקראי
            
            meteor.style.left = startX + 'px';
            meteor.style.top = startY + 'px';
            meteor.style.width = Math.random() * 4 + 3 + 'px';
            meteor.style.height = meteor.style.width;
            meteor.style.setProperty('--endX', endX + 'px');
            
            document.body.appendChild(meteor);
            
            setTimeout(() => {
                meteor.remove();
            }, 2500);
        }

        // הפעלת כוכבי שביט בזמן אקראי
        function startMeteorShower() {
            createStars();
            
            setInterval(() => {
                createMeteor();
            }, Math.random() * 4000 + 2000);
        }

        // הפעלה בעת טעינת הדף
        window.addEventListener('load', startMeteorShower);
    </script>
</body>
</html>
