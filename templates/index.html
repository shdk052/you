<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מוריד שירים מיוטיוב</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- חלקיקים צפים -->
    <div class="floating-particle" style="left: 10%; animation-delay: 0s;"></div>
    <div class="floating-particle" style="left: 25%; animation-delay: 3s;"></div>
    <div class="floating-particle" style="left: 40%; animation-delay: 6s;"></div>
    <div class="floating-particle" style="left: 55%; animation-delay: 9s;"></div>
    <div class="floating-particle" style="left: 70%; animation-delay: 12s;"></div>
    <div class="floating-particle" style="left: 85%; animation-delay: 15s;"></div>
    
    <div class="container">
        <h1>🎵 הורדת אודיו מיוטיוב</h1>
        <form id="downloadForm">
            <label for="youtubeLink">הכנס קישור לסרטון יוטיוב:</label>
            <input type="text" id="youtubeLink" name="youtubeLink" placeholder="הדבק קישור לכאן..." required autocomplete="off">
            <button type="submit">🚀 הורד</button>
        </form>
        <p id="statusMessage"></p>
    </div>

    <script>
        document.getElementById('downloadForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const link = document.getElementById('youtubeLink').value;
            const statusMessage = document.getElementById('statusMessage');
            
            statusMessage.className = 'downloading';
            statusMessage.textContent = 'מוריד... אנא המתן (עד 2 דקות).';
            statusMessage.style.color = '#b8e6f0';

            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ link: link })
                });

                if (response.ok) {
                    statusMessage.className = '';
                    statusMessage.textContent = '✅ ההורדה החלה!';
                    statusMessage.style.color = '#5ee0f5';
                    
                    const blob = await response.blob();
                    const contentDisposition = response.headers.get('content-disposition');
                    let fileName = 'download.mp3';

                    if (contentDisposition) {
                        const fileNameMatch = contentDisposition.match(/filename="(.+)"/);
                        if (fileNameMatch && fileNameMatch.length === 2) {
                            fileName = fileNameMatch[1].replace(/_/g, ' '); 
                        }
                    }

                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = fileName; 
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    window.URL.revokeObjectURL(url);
                    
                    statusMessage.className = 'success';
                    statusMessage.textContent = '✅ השיר ירד בהצלחה!';
                    statusMessage.style.color = '#5ee0f5';

                } else {
                    const errorData = await response.json();
                    statusMessage.className = 'error';
                    statusMessage.textContent = errorData.message;
                    statusMessage.style.color = '#ff6b8a';
                }

            } catch (error) {
                statusMessage.className = 'error';
                statusMessage.textContent = 'אירעה שגיאה: לא הצלחתי להתחבר לשרת או שהזמן קצוב פג.';
                statusMessage.style.color = '#ff6b8a';
                console.error('Error:', error);
            }
        });

        // יצירת כוכבים קבועים עם הבהוב עדין
        function createStars() {
            const starCount = 50;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                
                star.style.left = x + 'px';
                star.style.top = y + 'px';
                star.style.width = Math.random() * 2 + 1 + 'px';
                star.style.height = star.style.width;
                
                const delay = Math.random() * 4;
                const duration = Math.random() * 2 + 2;
                star.style.animationDelay = delay + 's';
                star.style.animationDuration = duration + 's';
                
                document.body.appendChild(star);
            }
        }

        // יצירת כוכבי שביט נופלים בולטים
        function createMeteor() {
            const meteor = document.createElement('div');
            meteor.className = 'meteor';
            
            const startX = Math.random() * window.innerWidth;
            const startY = -50;
            const endX = startX + (Math.random() * 200 - 100);
            
            meteor.style.left = startX + 'px';
            meteor.style.top = startY + 'px';
            meteor.style.width = Math.random() * 4 + 3 + 'px';
            meteor.style.height = meteor.style.width;
            meteor.style.setProperty('--endX', endX + 'px');
            
            document.body.appendChild(meteor);
            
            setTimeout(() => {
                meteor.remove();
            }, 2500);
        }

        // הפעלת כוכבי שביט בזמן אקראי
        function startMeteorShower() {
            createStars();
            
            setInterval(() => {
                createMeteor();
            }, Math.random() * 4000 + 2000);
        }

        // הפעלה בעת טעינת הדף
        window.addEventListener('load', startMeteorShower);
    </script>
</body>
</html>
